spring.application.name=demo

# Server port (Fly injects PORT; 8080 is the local default)
server.port=${PORT:8080}
# Trust the proxy headers so redirects/URLs work behind Fly's HTTPS proxy
server.forward-headers-strategy=framework

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rugwash}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Generous timeouts because Neon free databases suspend when idle and take a few seconds to wake.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=GhaslHikariCP

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Async & Scheduling
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=5

# GZIP Compression Configuration
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Admin and JWT properties
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:YXV0aG1vcml6YXRpb25zZWNyZXRrZXlmb3JkZXZlbG9wbWVudG9ubHk}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Geocode configuration
app.geocode.user-agent=${GEOCODE_USER_AGENT:}
app.geocode.referer=${GEOCODE_REFERER:}

# CSP Report-Only header (monitoring only, NOT enforced)
# Set to true to add Content-Security-Policy-Report-Only header to all responses
app.csp.report-only.enabled=false
