spring.application.name=demo

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/rugwash
spring.datasource.username=postgres
spring.datasource.password=1234
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rugwash}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=GhaslHikariCP

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Async & Scheduling
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=5

# GZIP Compression Configuration
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Admin and JWT properties
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:SuperSecretAdminPassword123!}
app.jwt.secret=${JWT_SECRET:ThisIsAVerySecretKeyForJWTGenerationThatIsAtLeast32BytesLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
