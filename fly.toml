# fly.toml app configuration file generated for lifewash on 2026-11-11T20:14:39+03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lifewash'
primary_region = 'ams'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
